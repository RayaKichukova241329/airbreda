<text x="50" y="673.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">At-least-once, idempotent writes</text>
<text x="50" y="688.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">Luchtmeetnet repeats 50 hours on every call;</text>
<text x="50" y="703.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">the primary key and file overwrites absorb duplicates.</text>
<path d="M490,644 L896,644 L910,658 L910,726 L490,726 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<path d="M896,644 L896,658 L910,658" fill="none" stroke="#d6b656" stroke-width="1"/>
<text x="500" y="673.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">Collected only while the laptop is on</text>
<text x="500" y="688.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">NDW only shows current traffic, so hours</text>
<text x="500" y="703.9" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333333">missed while the laptop is off are lost.</text>
