<text x="550.0" y="491.4" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">ingest_traffic.py</text>
<text x="550.0" y="506.4" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333333">Parse 4 sites: total flow</text>
