# Local test of the full Day 4 stack: both ingestion services plus the dashboard,
# all using the real cloud database and bucket through .env (no local database).
# The VM runs the same three containers with plain `docker run` (see ADR-005).
services:
  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POLL_INTERVAL_SECONDS: "3600"
      HEALTH_PORT: "8001"
      PYTHONUNBUFFERED: "1"

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    env_file: .env
    environment:
      POLL_INTERVAL_SECONDS: "3600"
      HEALTH_PORT: "8002"
      PYTHONUNBUFFERED: "1"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    environment:
      AIR_HEALTH_URL: http://air-ingest:8001/health
      TRAFFIC_HEALTH_URL: http://traffic-ingest:8002/health
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: [air-ingest, traffic-ingest]