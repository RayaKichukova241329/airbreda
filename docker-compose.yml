services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [airbreda]

  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
      POLL_INTERVAL_SECONDS: "3600"
      HEALTH_PORT: "8001"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8001:8001"   # /health, reachable from this machine only
    depends_on: [redis]
    restart: unless-stopped
    networks: [airbreda]

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: traffic-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
      POLL_INTERVAL_SECONDS: "3600"
      HEALTH_PORT: "8002"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8002:8002"   # /health, reachable from this machine only
    depends_on: [redis]
    restart: unless-stopped
    networks: [airbreda]

networks:
  airbreda: